name: OFRP CI
on:
  workflow_dispatch:
jobs:
  build:
    name: OFRP Build CI
    runs-on: ubuntu-22.04
    env:
      OEM: samsung
      DEVICE: loganreltexx
      BRANCH: twrp-6.0
    steps:
        - uses: actions/checkout@v7
        - name: Installing JDK 7 + Build Dependencies
          run: |
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            sudo add-apt-repository ppa:deadsnakes/ppa
            sudo add-apt-repository universe
            sudo apt-get update
            sudo apt-get install -y bc bison build-essential ccache curl flex axel g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
            wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb && sudo dpkg -i libtinfo5_6.3-2_amd64.deb && rm -f libtinfo5_6.3-2_amd64.deb
            wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb && sudo dpkg -i libncurses5_6.3-2_amd64.deb && rm -f libncurses5_6.3-2_amd64.deb
            cd /usr/local/src
            sudo wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
            sudo tar xvf Python-2.7.18.tgz
            cd Python-2.7.18
            sudo ./configure --enable-optimizations
            sudo make altinstall
            sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
            sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python
        - name: Install OpenJDK
          uses: actions/setup-java@v3
          with:
            distribution: 'zulu'
            java-version: '8'
        - name: Syncing TWRP sources
          run: |
            mkdir ~/OFRP
            cd ~/OFRP
            mkdir ~/.bin
            curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
            python3 ~/.bin/repo init --depth=1 -u https://github.com/unlegacy-devices/fox-6.0_manifest.git -b fox_6.0
            python3 ~/.bin/repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)
            git clone --depth=1 --branch cm-12.1 --single-branch https://github.com/notnoelchannel2/twrp_device_${{ env.OEM }}_${{ env.DEVICE }}.git device/${{ env.OEM }}/${{ env.DEVICE }}
            git clone --depth=1 --branch android-6.0.1_r32 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8 /opt/toolchains/arm-eabi-4.8
            git clone --depth=1 --branch cm-13.0 --single-branch https://github.com/MSM8930-Samsung/android_kernel_samsung_msm8930-common.git kernel/samsung/msm8930-common
        - name: Building TWRP
          run: |
            OLDPATH=$PATH
            OLDJAVAHOME=$JAVA_HOME
            export PATH="$HOME/.jdk_7/java-se-7u75-ri/bin:$PATH"
            export JAVA_HOME="$HOME/.jdk_7/java-se-7u75-ri"
            cd ~/OFRP
            rm -rf ~/OFRP/device/qcom/common
            git clone https://github.com/TeamWin/android_device_qcom_common -b android-6.0 ~/OFRP/device/qcom/common
            cat << 'EOF' > bootable/recovery/abx-functions.hpp
            #ifndef _ABXFUNCTIONS_HPP
            #define _ABXFUNCTIONS_HPP
            
            #include <fstream>
            #include <iostream>
            #include <sstream>
            #include <string>
            #include <cstring>
            #include <vector>
            #include <algorithm>
            #include <openssl/evp.h>
            
            // ABX (Android Binary XML) to XML converter
            // Copyright (c) 2022, _that
            // SPDX-License-Identifier: GPL-3.0-only
            // test: g++ -g abxtoxml.cpp `pkg-config --libs openssl` && ./a.out packages.xml
            // based on https://www.cclsolutionsgroup.com/post/android-abx-binary-xml
            
            using namespace std;
            
            class AbxToXml
            {
                std::istream& m_is;
                std::ostream& m_os;
                bool mTagOpen = false;
                std::vector<std::string> mInternedStrings;
                bool mError = true;
            
            public:
                AbxToXml(std::istream& is, std::ostream& os) : m_is(is), m_os(os) {}
            
                bool run()
                {     
                    mError = true;
                    char buffer[4];
                    m_is.read(buffer, 4);
                    if (memcmp(buffer, "ABX", 3) != 0)
                        return false;
                    if (buffer[3] != 0)
                        return false;
                  
                    mError = false;
                    return convert_abx_content();
                }
            
            private:
                enum Event
                {
                    START_DOCUMENT = 0,
                    END_DOCUMENT = 1,
                    START_TAG = 2,
                    END_TAG = 3,
                    TEXT = 4,
                    CDSECT = 5,
                    ENTITY_REF = 6,
                    IGNORABLE_WHITESPACE = 7,
                    PROCESSING_INSTRUCTION = 8,
                    COMMENT = 9,
                    DOCDECL = 10,
                    ATTRIBUTE = 15,
                };
            
                enum Type
                {
                    TYPE_NULL = 1 << 4,
                    TYPE_STRING = 2 << 4,
                    TYPE_STRING_INTERNED = 3 << 4,
                    TYPE_BYTES_HEX = 4 << 4,
                    TYPE_BYTES_BASE64 = 5 << 4,
                    TYPE_INT = 6 << 4,
                    TYPE_INT_HEX = 7 << 4,
                    TYPE_LONG = 8 << 4,
                    TYPE_LONG_HEX = 9 << 4,
                    TYPE_FLOAT = 10 << 4,
                    TYPE_DOUBLE = 11 << 4,
                    TYPE_BOOLEAN_TRUE = 12 << 4,
                    TYPE_BOOLEAN_FALSE = 13 << 4,
                };
            
                bool convert_abx_content()
                {
                    char b;
                    while (m_is.get(b))
                    {
                        Event ev = Event(b & 0xf);
                        Type ty = Type(b & 0xf0);
            
                        if (ev == ATTRIBUTE)
                        {
                            m_os << " " << read_data(TYPE_STRING_INTERNED);
                            m_os << "=\"";
                            m_os << read_data(ty);
                            m_os << '"';
                            continue;
                        }
                        if (mTagOpen)
                        {
                            m_os << ">";
                            mTagOpen = false;
                        }
                        std::string data = read_data(ty);
                        dispatch_event(ev, data);
                    }
                    return !mError;
                }
            
                void dispatch_event(Event ev, const std::string& data)
                {
                    switch (ev)
                    {
                        case START_DOCUMENT:
                        case END_DOCUMENT:
                            break;
            
                        case START_TAG:
                            m_os << "<" << data;
                            mTagOpen = true;
                            break;
            
                        case END_TAG:
                            m_os << "</" << data << ">";
                            break;
            
                        case TEXT:
                            m_os << data;
                            break;
            
                        case CDSECT:
                            m_os << "<![CDATA[" <<  data << "]]>";
                            break;
            
                        case ENTITY_REF:
                        case IGNORABLE_WHITESPACE:
                        case PROCESSING_INSTRUCTION:
                        case COMMENT:
                        case DOCDECL:
                            m_os << data;
                            break;
            
                        default:
                            m_os << "#error: Invalid event " << int(ev);
                            mError = true;
                            break;
                    }
                }
            
                template <typename T> static T read_bswap(std::istream& is)
                {
                    char buffer[sizeof(T)];
                    is.read(buffer, sizeof(T));
                    std::reverse(std::begin(buffer), std::end(buffer));
                    return *reinterpret_cast<T*>(buffer);
                }
            
                static uint16_t read_uint16(std::istream& is)
                {
                    return read_bswap<uint16_t>(is);
                }
            
                static std::string read_string(std::istream& is)
                {
                    uint16_t length = read_uint16(is);
                    std::string s;
                    s.resize(length);
                    is.read(&s[0], length);
                    return s;
                }
            
                std::string read_data(Type ty)
                {
                    switch (ty)
                    {
                        case TYPE_NULL:
                            return {};
            
                        case TYPE_STRING:
                            return read_string(m_is);
            
                        case TYPE_STRING_INTERNED:
                            {
                                uint16_t id = read_uint16(m_is);
                                if (id == 0xffff)
                                {
                                    std::string s = read_string(m_is);
                                    mInternedStrings.push_back(s);
                                    return s;
                                }
                                if (id >= mInternedStrings.size())
                                {
                                    mError = true;
                                    return "#error: invalid string ID";
                                }
                                return mInternedStrings.at(id);
                            }
            
                        case TYPE_BYTES_HEX:
                            {
                                std::string s = read_string(m_is);
                                std::string hex;
                                static const char* hexdigits = "0123456789abcdef";
                                for (unsigned char c : s)
                                {
                                    hex += hexdigits[c >> 4];
                                    hex += hexdigits[c & 0xf];
                                }
                                return hex;
                            }
            
                        case TYPE_BYTES_BASE64:
                        {
                            std::string s = read_string(m_is);
                            std::string base64_alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
                            std::string b64;
            
                            for (size_t i = 0; i < s.length(); i += 3)
                            {
                                uint32_t n = 0;
                                for (size_t j = 0; j < 3; j++)
                                {
                                    n <<= 8;
                                    if (i + j < s.length())
                                    {
                                        n |= s[i + j];
                                    }
                                }
            
                                for (size_t j = 0; j < 4; j++)
                                {
                                    uint8_t block = (n >> (18 - j * 6)) & 0x3F;
                                    b64 += base64_alphabet[block];
                                }
                            }
            
                            if (s.length() % 3 > 0)
                            {
                                uint32_t n = 0;
                                for (size_t j = 0; j < s.length() % 3; j++)
                                {
                                    n <<= 8;
                                    n |= s[s.length() - j - 1];
                                }
            
                                for (size_t j = 0; j < 4; j++)
                                {
                                    uint8_t block = (n >> (18 - j * 6)) & 0x3F;
                                    b64 += base64_alphabet[block];
                                }
            
                                for (size_t j = s.length() % 3; j < 3; j++)
                                {
                                    b64 += '=';
                                }
                            }
            
                            return b64;
                        }
            
                        case TYPE_INT_HEX:
                        case TYPE_INT:
                            {
                                int32_t val = read_bswap<int>(m_is);
                                std::stringstream ss;
                                ss << val;
                                return ss.str();
                            }
            
                        case TYPE_LONG_HEX:
                        case TYPE_LONG:
                            {
                                int64_t val = read_bswap<long>(m_is);
                                std::stringstream ss;
                                ss << val;
                                return ss.str();
                            }
            
                        case TYPE_FLOAT:
                            {
                                float val = read_bswap<float>(m_is);
                                std::stringstream ss;
                                ss << val;
                                return ss.str();
                            }
            
                        case TYPE_DOUBLE:
                            {
                                double val = read_bswap<double>(m_is);
                                std::stringstream ss;
                                ss << val;
                                return ss.str();
                            }
            
                        case TYPE_BOOLEAN_TRUE:
                            return "1";
            
                        case TYPE_BOOLEAN_FALSE:
                            return "0";
                    }
                    mError = true;
                    return "#error: invalid type";
                }
            };
            
            #endif // _ABXFUNCTIONS_HPP
            EOF
            source build/envsetup.sh
            export ALLOW_MISSING_DEPENDENCIES=true
            export LC_ALL="C"
            export OF_FL_PATH1="/flashlight"
            export OF_MAINTAINER="NotNoelChannel"
            export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
            export OF_LEGACY_SHAR512=1
            export OF_DISABLE_KEYMASTER2=1
            lunch omni_${{ env.DEVICE }}-eng
            make -j$(nproc --all) recoveryimage
            export PATH=$OLDPATH
            export JAVA_HOME=$OLDJAVAHOME
        - name: Uploading TWRP builds
          uses: actions/upload-artifact@v5
          with:
            name: twrp
            path: /home/runner/OFRP/out/target/product/${{ env.DEVICE }}/recovery.*
